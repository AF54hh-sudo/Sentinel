[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-decision-intelligence"
version = "0.1.0"
description = "Data-science foundation for AMX Tech business decision intelligence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic-settings>=2.2,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]
phase3 = ["SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]
science = ["scipy>=1.13,<2", "statsmodels>=0.14,<1", "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "plotly>=5.24,<7"]
dashboard = ["streamlit>=1.38,<2"]
llm = ["openai>=2,<3"]
orchestration = ["langgraph>=1,<2"]
rag = ["openai>=2,<3", "pgvector>=0.3,<1"]
app = ["streamlit>=1.38,<2", "langgraph>=1,<2", "openai>=2,<3", "pgvector>=0.3,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["sentinel"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
